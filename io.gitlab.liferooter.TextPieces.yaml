id: io.gitlab.liferooter.TextPieces

runtime: org.gnome.Platform
runtime-version: '51'

sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable

command: textpieces

finish-args:
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --share=ipc
- --talk-name=org.freedesktop.Flatpak
- --filesystem=~/.local/share/textpieces

modules:

- name: textpieces
  buildsystem: meson
  build-options:
    append-path: /usr/lib/sdk/rust-stable/bin
  sources:
  - type: archive
    url: https://gitlab.com/liferooter/textpieces/-/archive/4.3.2/textpieces-4.3.2.tar.gz
    sha256: 436d673034fe3c939664ee4ec24289cea5d7773d72a6f78959dccf23c449253f
  - cargo-sources.json
  - type: shell
    commands:
    - mkdir .cargo
    - cp cargo/config .cargo/config.toml
